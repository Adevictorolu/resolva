name: Build Android APK (Smallest Size Split-ABI)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Optimized Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Optimized Split Release APKs
        run: |
          flutter build apk --release --split-per-abi \
            --android-skip-build-dependency-validation \
            --dart-define=SUPABASE_URL="${{ vars.SUPABASE_URL || 'https://jykwnzabsrbxcvaiykih.supabase.co' }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ vars.SUPABASE_ANON_KEY || 'sb_publishable_qwWqoND6dPiWH9cQC_S9Gg_AW8XVCkG' }}"

      - name: List Generated APKs
        run: |
          ls -lh build/app/outputs/flutter-apk/



