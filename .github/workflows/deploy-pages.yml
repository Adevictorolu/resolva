name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build Flutter web
        run: >
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL || 'https://jykwnzabsrbxcvaiykih.supabase.co' }}
          --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY || 'sb_publishable_qwWqoND6dPiWH9cQC_S9Gg_AW8XVCkG' }}
          --dart-define=PAYSTACK_PUBLIC_KEY=${{ vars.PAYSTACK_PUBLIC_KEY || 'pk_live_58d1473922bf544d0a24c1ffed660b6cb9a0c0e4' }}

      - name: SPA fallback (404.html)
        run: cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Build cPanel Root Production Web Assets
        run: |
          flutter build web --release \
            --base-href "/" \
            --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL || 'https://jykwnzabsrbxcvaiykih.supabase.co' }} \
            --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY || 'sb_publishable_qwWqoND6dPiWH9cQC_S9Gg_AW8XVCkG' }} \
            --dart-define=PAYSTACK_PUBLIC_KEY=${{ vars.PAYSTACK_PUBLIC_KEY || 'pk_live_58d1473922bf544d0a24c1ffed660b6cb9a0c0e4' }}
          mkdir -p cpanel_bundle
          cp -r build/web/* cpanel_bundle/
          cp build/web/index.html cpanel_bundle/404.html
          cat << 'EOF' > cpanel_bundle/.htaccess
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteRule ^index\.html$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.html [L]
          </IfModule>
          EOF
          cd cpanel_bundle && zip -r ../resolva-cpanel-production.zip . && cd ..

      - name: Upload cPanel Production ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: resolva-cpanel-production
          path: resolva-cpanel-production.zip

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
